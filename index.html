<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<title>Jahedography – ফটোগ্রাফি</title>
<meta name="description" content="বিয়ে, পোর্ট্রেট, ইভেন্ট ও প্রোডাক্ট ফটোগ্রাফি">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0f;--c1:#17171a;--c2:#1f1f23;--ln:#2b2b30;--tx:#f5efe6;--mut:#a39e96;--ac:#e8723a;--ac2:#f39a6b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.w{max-width:1060px;margin:auto;padding:0 18px}
header{position:fixed;top:0;left:0;right:0;z-index:30;transition:.25s}header.s{background:rgba(14,14,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.hb{display:flex;align-items:center;gap:14px;height:62px}.brand{display:flex;align-items:center;gap:10px;font:700 20px 'Playfair Display',Georgia,serif;flex:1}.brand img{height:38px;width:38px;border-radius:10px;object-fit:cover}
.mk{width:38px;height:38px;border-radius:10px;background:var(--ac);display:grid;place-items:center;color:#fff;font-size:20px}
.nl{display:flex;gap:20px;font-size:15px;color:var(--mut)}.nl a:hover{color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;border-radius:99px;font:inherit;font-weight:600;border:0;cursor:pointer;background:var(--ac);color:#fff}.btn.g{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff}
.hero{min-height:100vh;display:flex;align-items:center;position:relative;background:radial-gradient(900px 500px at 80% 20%,rgba(232,114,58,.28),transparent 60%),linear-gradient(160deg,#1a1210,#0e0e0f 60%) center/cover}
.hero.im::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,14,15,.88),rgba(14,14,15,.45))}
.hero .w{position:relative;padding-top:80px;padding-bottom:60px}.eyebrow{color:var(--ac2);letter-spacing:.2em;font-size:13px;text-transform:uppercase;margin-bottom:14px}
h1{font:700 clamp(38px,8vw,72px)/1.15 'Playfair Display','Hind Siliguri',Georgia,serif;margin-bottom:16px}.lead{font-size:18px;color:#d9d2c8;max-width:560px;margin-bottom:28px}.hb2{display:flex;gap:12px;flex-wrap:wrap}
section{padding:72px 0}h2{font:700 clamp(28px,5vw,40px)/1.2 'Playfair Display','Hind Siliguri',Georgia,serif;margin-bottom:8px}.sub{color:var(--mut);margin-bottom:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.chips button{font:inherit;border:1px solid var(--ln);background:var(--c1);color:var(--mut);padding:8px 18px;border-radius:99px;cursor:pointer}.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.gal{columns:3 260px;column-gap:12px}.gal figure{break-inside:avoid;margin-bottom:12px;border-radius:14px;overflow:hidden;cursor:zoom-in;position:relative;background:var(--c1)}.gal img{width:100%;transition:transform .4s}.gal figure:hover img{transform:scale(1.04)}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.pc{background:var(--c1);border:1px solid var(--ln);border-radius:20px;padding:24px;position:relative}.pc.hot{border-color:var(--ac)}
.bdg{position:absolute;top:-12px;right:18px;background:var(--ac);color:#fff;font-size:13px;font-weight:600;padding:2px 14px;border-radius:99px}.pc h3{font-size:20px}.pr{font:700 36px 'Playfair Display',Georgia,serif;color:var(--ac2);margin:6px 0 14px}.pc ul{list-style:none;color:var(--mut);margin-bottom:20px}.pc li{padding:5px 0;border-bottom:1px dashed var(--ln)}.pc li::before{content:"✓ ";color:var(--ac)}
.ab{display:grid;grid-template-columns:1fr;gap:18px}.ab p{color:#d9d2c8;font-size:17px;white-space:pre-line}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:20px;padding:22px}label{display:block;color:var(--mut);font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;color:var(--tx);font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--ac)}textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.err{color:#ff8a8a;min-height:20px;margin-top:8px;font-size:14px}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.soc a{border:1px solid var(--ln);background:var(--c1);padding:10px 18px;border-radius:99px;font-size:15px}.soc a:hover{border-color:var(--ac)}
footer{border-top:1px solid var(--ln);padding:28px 0;text-align:center;color:var(--mut);font-size:14px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 24px #0008}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:none;align-items:center;justify-content:center}.lb.on{display:flex}.lb img{max-width:94vw;max-height:86vh;border-radius:8px;touch-action:pan-y}
.lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer}.lb .x{top:16px;right:16px}.lb .p{left:12px;top:50%}.lb .n{right:12px;top:50%}.lb small{position:absolute;bottom:18px;color:#bbb}
@media(max-width:640px){.gal{columns:2}.nl{display:none}section{padding:56px 0}.two{grid-template-columns:1fr}.hero{min-height:92vh}}
</style></head><body>
<header id="hd"><div class="w hb"><a class="brand" href="#top" id="br"></a><nav class="nl"><a href="#work">কাজ</a><a href="#pack">প্যাকেজ</a><a href="#about">পরিচিতি</a><a href="#book">বুকিং</a></nav><a class="btn" style="height:40px;padding:0 20px;font-size:15px" href="#book">বুকিং দিন</a></div></header>
<main id="app"></main>
<a class="wa" id="wa" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>
<div class="lb" id="lb"><button class="x" id="lx">✕</button><button class="p" id="lp">‹</button><img id="li" alt=""><button class="n" id="ln">›</button><small id="lc"></small></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const SITE="jahed",CK="pg_cache_"+SITE;
const db=getFirestore(initializeApp({apiKey:"AIzaSyD1uWle_USBMBO_rJuT64TMCmmzyO1rdH8",authDomain:"techcraft-gigs.firebaseapp.com",projectId:"techcraft-gigs",storageBucket:"techcraft-gigs.firebasestorage.app",messagingSenderId:"402779044950",appId:"1:402779044950:web:f728c347d9d23d18b48ff7"}));
let P={settings:{},cats:[],photos:[],packages:[]},S={};
async function fetchAll(){
 const sd=await getDoc(doc(db,"pg_site",SITE));if(!sd.exists())return null;
 const ps=await getDocs(query(collection(db,"pg_img"),where("site","==",SITE)));
 const d=sd.data();return{settings:d.settings||{},cats:d.cats||[],packages:d.packages||[],photos:ps.docs.map(x=>({id:x.id,...x.data(),img:x.data().th}))}}
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),tk=n=>'৳'+bn(Math.round(n).toLocaleString('en-US'));
const wa=n=>'https://wa.me/'+String(n||'').replace(/\D/g,'');
function head(){document.title=(S.name||'ফটোগ্রাফি')+' – ফটোগ্রাফি';$('#br').innerHTML=(S.logo?`<img src="${esc(S.logo)}" alt="">`:`<span class="mk">◐</span>`)+`<span>${esc(S.name)}</span>`;
$('#wa').href=wa(S.whatsapp)+'?text='+encodeURIComponent('আসসালামু আলাইকুম, আমি আপনার সাইট থেকে যোগাযোগ করছি।');
$('#wa').style.display=S.whatsapp?'':'none'}
let ph=[],cat='all',cur=[],ci=0;
function render(){
 const hs=S.hero?`style="background-image:url('${esc(S.hero)}')"`:'';
 $('#app').innerHTML=`<section class="hero ${S.hero?'im':''}" id="top" ${hs}><div class="w"><div class="eyebrow">${esc(S.tag)}</div><h1>${esc(S.title)}</h1><p class="lead">${esc(S.text)}</p><div class="hb2"><a class="btn" href="#book">বুকিং দিন</a><a class="btn g" href="#work">কাজ দেখুন</a></div></div></section>
 <section id="work"><div class="w"><h2>আমার কাজ</h2><p class="sub">কয়েকটি বাছাই করা ছবি</p><div class="chips" id="ch"></div><div class="gal" id="gl"></div></div></section>
 ${P.packages.length?`<section id="pack" style="background:var(--c1)"><div class="w"><h2>প্যাকেজ ও দাম</h2><p class="sub">আপনার প্রয়োজন অনুযায়ী বেছে নিন। কাস্টম প্যাকেজও করা যায়।</p><div class="pk">${P.packages.map(k=>`<div class="pc ${k.badge?'hot':''}">${k.badge?`<span class="bdg">${esc(k.badge)}</span>`:''}<h3>${esc(k.name)}</h3><div class="pr">${tk(k.price)}</div><ul>${(k.items||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul><a class="btn" style="width:100%" href="#book" data-pk="${esc(k.name)}">এটি বুক করুন</a></div>`).join('')}</div></div></section>`:''}
 <section id="about"><div class="w ab"><div><h2>পরিচিতি</h2></div><p>${esc(S.about)}</p><div class="soc">${S.fb?`<a target="_blank" rel="noopener" href="${esc(S.fb)}">ফেসবুক</a>`:''}${S.insta?`<a target="_blank" rel="noopener" href="${esc(S.insta)}">ইনস্টাগ্রাম</a>`:''}${S.youtube?`<a target="_blank" rel="noopener" href="${esc(S.youtube)}">ইউটিউব</a>`:''}${S.whatsapp?`<a target="_blank" rel="noopener" href="${wa(S.whatsapp)}">WhatsApp</a>`:''}</div></div></section>
 <section id="book" style="background:var(--c1)"><div class="w" style="max-width:640px"><h2>বুকিং দিন</h2><p class="sub">তথ্য দিন, আমরা WhatsApp এ কথা বলে নিশ্চিত করব।${S.address?' 📍 '+esc(S.address):''}</p><div class="card"><label style="margin-top:0">আপনার নাম</label><input id="bn1" autocomplete="name"><div class="two"><div><label>মোবাইল নম্বর</label><input id="bp" inputmode="tel" autocomplete="tel"></div><div><label>তারিখ</label><input id="bd" type="date"></div></div><label>কী ধরনের কাজ</label><select id="bt"><option value="">বেছে নিন</option>${P.cats.map(c=>`<option>${esc(c.name)}</option>`).join('')}<option>অন্যান্য</option></select>${P.packages.length?`<label>প্যাকেজ (ঐচ্ছিক)</label><select id="bk"><option value="">এখনো ঠিক করিনি</option>${P.packages.map(k=>`<option>${esc(k.name)} – ${tk(k.price)}</option>`).join('')}</select>`:''}<label>আরও কিছু বলতে চান</label><textarea id="bm"></textarea><div class="err" id="be"></div><button class="btn" style="width:100%" id="bs">WhatsApp এ বুকিং পাঠান</button></div></div></section>`;
 drawGal();
 document.querySelectorAll('[data-pk]').forEach(a=>a.onclick=()=>setTimeout(()=>{const s=$('#bk');if(s)[...s.options].forEach((o,i)=>{if(o.text.startsWith(a.dataset.pk))s.selectedIndex=i})},50));
 $('#bs').onclick=()=>{const n=$('#bn1').value.trim(),p=$('#bp').value.trim(),t=$('#bt').value;if(!n||!p||!t)return $('#be').textContent='নাম, মোবাইল নম্বর আর কাজের ধরন দিন';
  const m=`আসসালামু আলাইকুম, বুকিং দিতে চাই।\nনাম: ${n}\nমোবাইল: ${p}\nকাজ: ${t}${$('#bk')&&$('#bk').value?'\nপ্যাকেজ: '+$('#bk').value:''}${$('#bd').value?'\nতারিখ: '+$('#bd').value:''}${$('#bm').value.trim()?'\nবার্তা: '+$('#bm').value.trim():''}`;
  window.open(wa(S.whatsapp)+'?text='+encodeURIComponent(m),'_blank')}
}
function drawGal(){
 const used=[...new Set(ph.map(p=>p.cat))],cs=P.cats.filter(c=>used.includes(c.id));
 $('#ch').innerHTML=`<button data-c="all" class="${cat==='all'?'on':''}">সব</button>`+cs.map(c=>`<button data-c="${c.id}" class="${cat===c.id?'on':''}">${esc(c.name)}</button>`).join('');
 cur=ph.filter(p=>cat==='all'||p.cat===cat);
 $('#gl').innerHTML=cur.length?cur.map((p,i)=>`<figure data-i="${i}"><img loading="lazy" src="${esc(p.img)}" alt="${esc(p.title||'')}"></figure>`).join(''):'<p class="sub">শীঘ্রই ছবি যোগ হবে।</p>';
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;drawGal()});
 document.querySelectorAll('[data-i]').forEach(f=>f.onclick=()=>openLb(+f.dataset.i))
}
function openLb(i){ci=i;$('#lb').classList.add('on');document.body.style.overflow='hidden';show()}
const FULL={};
function show(){if(!cur.length)return;ci=(ci+cur.length)%cur.length;const p=cur[ci];$('#li').src=FULL[p.id]||p.img;if(!FULL[p.id])getDoc(doc(db,'pg_full',p.id)).then(d=>{if(d.exists()){FULL[p.id]=d.data().img;if(cur[ci]&&cur[ci].id===p.id)$('#li').src=FULL[p.id]}}).catch(()=>{});$('#lc').textContent=bn(ci+1)+' / '+bn(cur.length)}
function close(){$('#lb').classList.remove('on');document.body.style.overflow=''}
$('#lx').onclick=close;$('#lp').onclick=()=>{ci--;show()};$('#ln').onclick=()=>{ci++;show()};$('#lb').onclick=e=>{if(e.target.id==='lb')close()};
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft'){ci--;show()}if(e.key==='ArrowRight'){ci++;show()}});
let tx=0;$('#lb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});$('#lb').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){ci+=d<0?1:-1;show()}});
window.addEventListener('scroll',()=>$('#hd').classList.toggle('s',scrollY>40),{passive:true});
function apply(D){P=D;S=P.settings||{};ph=P.photos.filter(p=>!p.hidden).sort((a,b)=>(a.date||0)-(b.date||0));if(cat!=='all'&&!ph.some(p=>p.cat===cat))cat='all';head();render()}
let cached=null;try{cached=JSON.parse(localStorage.getItem(CK)||'null')}catch(e){}
if(cached)apply(cached);else $('#app').innerHTML='<p class="sub" style="text-align:center;padding:40vh 18px 0">লোড হচ্ছে…</p>';
fetchAll().then(D=>{if(!D){if(!cached)$('#app').innerHTML='<p class="sub" style="text-align:center;padding:40vh 18px 0">সাইট শীঘ্রই চালু হচ্ছে।</p>';return}
 apply(D);try{localStorage.setItem(CK,JSON.stringify(D))}catch(e){}}).catch(()=>{if(!cached)$('#app').innerHTML='<p class="sub" style="text-align:center;padding:40vh 18px 0">ইন্টারনেট চেক করে আবার চেষ্টা করুন।</p>'});
</script></body></html>
